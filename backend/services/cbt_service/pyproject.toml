dependencies = [
    "alembic>=1.19.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "httpx2>=2.10.0",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.fastapi]
entrypoint = "cbt_service.main:app"
