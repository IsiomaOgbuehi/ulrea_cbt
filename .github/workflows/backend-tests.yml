# Runs both services' tests. Called by the deploy workflows, and on its own for
# pull requests, so nothing reaches staging or production without passing.
name: Backend tests

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/**"]
  workflow_call:

jobs:
  auth:
    name: Auth tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/auth
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Test-only values; the tests use an in-memory database.
      ENVIRONMENT: dev   # the tests expect dev behaviour (codes returned, no emails sent)
      SECRET_KEY: test-secret
      JWT_SECRET: test-jwt-secret-that-is-long-enough-0123456789
      JWT_ALGORITHM: HS256
      OTP_SECRET: test-otp-secret
      INTERNAL_SECRET: test-internal
      CBT_SERVICE_URL: http://127.0.0.1:1
      MAIL_FROM: Juwazi <test@example.com>
      FRONTEND_URL: http://localhost:8080
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q -p no:cacheprovider tests

  cbt:
    name: CBT tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/cbt_service
    env:
      ENVIRONMENT: dev   # the tests expect dev behaviour (codes returned, no emails sent)
      SECRET_KEY: test-secret
      JWT_SECRET: testsecret
      JWT_ALGORITHM: HS256
      OTP_SECRET: test-otp-secret
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      STORAGE_BACKEND: local
      MEDIA_ROOT: /tmp/media-test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q -p no:cacheprovider cbt_service/tests
